info:
  name: 02 Login user
  type: http
  seq: 2
  tags:
    - smoke
    - auth

http:
  method: POST
  url: "{{base_url}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "wallet_address": "{{wallet_address}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('token', res.body.token);
    - type: tests
      code: |-
        test('login returns 200', function() {
          expect(res.status).to.equal(200);
        });

        test('login returns token', function() {
          expect(res.body.token).to.be.a('string');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
