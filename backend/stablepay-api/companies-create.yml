info:
  name: 04 Create company
  type: http
  seq: 4
  tags:
    - smoke
    - companies

http:
  method: POST
  url: "{{base_url}}/api/companies"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "{{company_name}}",
        "vault_address": null
      }


runtime:
  scripts:
    - type: after-response
      code: bru.setVar('company_id', res.body.id);
    - type: tests
      code: |-
        test('create company returns 200', function() {
          expect(res.status).to.equal(200);
        });

        test('create company returns id and expected name', function() {
          expect(res.body.id).to.be.a('string');
          expect(res.body.name).to.equal(bru.getVar('company_name'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
