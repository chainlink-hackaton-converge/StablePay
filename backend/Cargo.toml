[package]
name = "stablepay-backend"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
tower-http = { version = "0.6.8", features = ["cors"] }
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
uuid = { version = "1.21.0", features = ["v7", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
rust_decimal = { version = "1.40.0", features = ["serde-with-str"] }
bcrypt = "0.18.0"